{
  "ID": "vendor-onboarding-capm",
  "version": "1.0.0",
  "_schema-version": "3.3.0",
  "description": "Vendor Onboarding CAPM — IBM Internship Assignment",
  "parameters": {
    "enable-parallel-deployments": true
  },
  "modules": [
    {
      "name": "vendor-onboarding-srv",
      "type": "nodejs",
      "path": ".",
      "parameters": {
        "buildpack": "nodejs_buildpack"
      },
      "build-parameters": {
        "builder": "npm",
        "ignore": ["node_modules/"]
      },
      "requires": [
        {
          "name": "vendor-onboarding-db"
        },
        {
          "name": "vendor-onboarding-auth"
        }
      ],
      "provides": [
        {
          "name": "srv-api",
          "properties": {
            "srv-url": "${default-url}"
          }
        }
      ]
    },
    {
      "name": "vendor-onboarding-db-deployer",
      "type": "hdb",
      "path": "gen/db",
      "parameters": {
        "buildpack": "nodejs_buildpack"
      },
      "requires": [
        {
          "name": "vendor-onboarding-db"
        }
      ]
    }
  ],
  "resources": [
    {
      "name": "vendor-onboarding-db",
      "type": "com.sap.xs.hdi-container",
      "parameters": {
        "service": "hana",
        "service-plan": "hdi-shared"
      }
    },
    {
      "name": "vendor-onboarding-auth",
      "type": "org.cloudfoundry.managed-service",
      "parameters": {
        "service": "xsuaa",
        "service-plan": "application",
        "path": "./xs-security.json"
      }
    }
  ]
}
